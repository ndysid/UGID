name: Build & Release Universal Games (Split APK)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK for ${{ matrix.abi }}
        run: |
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            ./gradlew assembleArm64V8aRelease --stacktrace
          else
            ./gradlew assembleArmeabiV7aRelease --stacktrace
          fi

      - name: Upload APK ${{ matrix.abi }}
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGames-${{ matrix.abi }}
          path: app/build/outputs/apk/*/release/*.apk

      - name: Build Universal APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGames-universal
          path: app/build/outputs/apk/release/*-universal.apk

      - name: Build Bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p release
          cp -r artifacts/*/* release/
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
